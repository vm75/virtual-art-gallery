name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal web)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/gallery ./cmd/gallery
      - name: Check browser modules
        run: find web/static -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test pure museum browser logic
        run: find web/static -maxdepth 1 -name '*.test.mjs' -print0 | sort -z | xargs -0 -n1 node
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OCI image
        run: docker build --file Containerfile --tag virtual-art-gallery:ci .
